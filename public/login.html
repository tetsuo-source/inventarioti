<!DOCTYPE html>
<html lang="es" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso - IT Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body { background-color: #f4f6f9; display: flex; align-items: center; justify-content: center; height: 100vh; }
        html[data-bs-theme="dark"] body { background-color: #212529; }
        html[data-bs-theme="dark"] .bg-white { background-color: #2c3034 !important; border-color: #373b3e !important; }
    </style>
</head>
<body>
    <div class="card shadow-sm bg-white" style="width: 100%; max-width: 400px; border: none; border-radius: 10px;">
        <div class="card-body p-4">
            <div class="text-center mb-4">
                <i class="bi bi-hdd-network text-primary" style="font-size: 3rem;"></i>
                <h4 class="mt-2 font-weight-bold">IT Dashboard</h4>
                <p class="text-muted small">Acceso restringido a personal autorizado</p>
            </div>
            
            <form id="formLogin">
                <div class="mb-3">
                    <label class="form-label small">Usuario</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-person"></i></span>
                        <input type="text" id="userInput" class="form-control" required autofocus>
                    </div>
                </div>
                <div class="mb-4">
                    <label class="form-label small">Contraseña</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-key"></i></span>
                        <input type="password" id="passInput" class="form-control" required>
                    </div>
                </div>
                
                <div id="errorMsg" class="alert alert-danger d-none small py-2 text-center">
                    Credenciales incorrectas
                </div>

                <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">Ingresar al Sistema</button>
            </form>
        </div>
    </div>

    <script>
        // Mantener el modo oscuro en el login si estaba activado
        if (localStorage.getItem('theme') === 'dark') {
            document.documentElement.setAttribute('data-bs-theme', 'dark');
        }

        document.getElementById('formLogin').addEventListener('submit', async (e) => {
            e.preventDefault();
            const user = document.getElementById('userInput').value;
            const pass = document.getElementById('passInput').value;
            const errorMsg = document.getElementById('errorMsg');
            
            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user, pass })
                });

                if (res.ok) {
                    window.location.href = '/index.html'; // Redirige al dashboard
                } else {
                    errorMsg.classList.remove('d-none');
                    document.getElementById('passInput').value = '';
                }
            } catch (err) {
                alert('Error conectando con el servidor');
            }
        });
    </script>
</body>
</html>
